name: Build and Push to Docker Hub (Production)

on:
  push:
    branches: [production]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Git Tag
        run: echo "GIT_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      # Checkout the repo
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

        
      - name: Set up Docker Buildx # modern Docker builder that supports multi-platform builds
        uses: docker/setup-buildx-action@v3

      # Log into Docker Hub
      - name: Log into Docker Hub
        uses: docker/login-action@v3.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Docker image
      - name: 'Build Docker image and push to registry'
        env: 
            IMAGE_TAG: ${{ env.GIT_TAG }}
        run: | 
          docker build MyHeatRisk-ACS --file MyHeartRisk-ACS/Dockerfile --tag ${{ secrets.DOCKERHUB_USERNAME }}/myheartrisk-acs-api:$IMAGE_TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myheartrisk-acs-api:$IMAGE_TAG